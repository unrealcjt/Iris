<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>高级生词卡片</title>
    <style>
        /* 基础样式与高级暗色调底色 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d0e12; color: #f3f4f6; }

        /* 游戏/应用容器 */
        #app-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 24px 30px 24px; box-sizing: border-box; }

        /* 左上角退出图标 */
        #exit-btn { position: absolute; top: 16px; left: 16px; width: 36px; height: 36px; background: rgba(255, 255, 255, 0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.2s; }
        #exit-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.15); }

        /* 顶部进度指示器 */
        #progress-indicator { font-size: 13px; color: #9ca3af; font-weight: 500; letter-spacing: 1px; background: rgba(255, 255, 255, 0.03); padding: 4px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }

        /* 核心：3D翻转卡片容器 */
        .card-perspective { perspective: 1000px; width: 100%; max-width: 320px; height: 260px; margin: auto 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }

        /* 激活翻转状态 */
        .card-inner.is-flipped { transform: rotateY(180deg); }

        /* 卡片正反面共有样式（拟物磨砂玻璃质感） */
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.03) 100%); border: 1px solid rgba(255, 255, 255, 0.13); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); backdrop-filter: blur(16px); }

        /* 卡片背面额外处理 */
        .card-back { transform: rotateY(180deg); background: linear-gradient(135deg, rgba(255, 105, 180, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%); border-color: rgba(255, 105, 180, 0.25); }

        /* 正面：日语单词样式 */
        .word-japanese { font-size: 32px; font-weight: bold; color: #ffffff; text-align: center; margin-bottom: 16px; letter-spacing: 1px; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
        .hint-text { font-size: 11px; color: #ff69b4; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; animation: pulse 2s infinite; }

        /* 背面：中文释义样式 */
        .word-chinese { font-size: 22px; font-weight: 500; color: #ff69b4; text-align: center; line-height: 1.4; }

        /* 底部导航控制器 */
        .nav-controls { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 280px; gap: 20px; }

        /* 高级悬浮按钮 */
        .btn-nav { flex: 1; height: 44px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s ease; backdrop-filter: blur(4px); }
        .btn-nav:active:not(:disabled) { transform: scale(0.95); background: rgba(255, 255, 255, 0.12); }
        .btn-nav:disabled { opacity: 0.25; cursor: not-allowed; }

        /* 动画：提示文字微弱呼吸效果 */
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.5; transform: scale(0.98); }
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="exit-btn" onclick="triggerExit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
    </div>

    <div id="progress-indicator">0 / 0</div>

    <div class="card-perspective">
        <div id="card-inner" class="card-inner" onclick="flipCard()">
            <div class="card-face card-front">
                <div id="display-japanese" class="word-japanese">読み込み中</div>
                <div class="hint-text">点击看答案</div>
            </div>
            <div class="card-face card-back">
                <div id="display-chinese" class="word-chinese">加载中...</div>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button id="btn-prev" class="btn-nav" onclick="prevCard()" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            上一张
        </button>
        <button id="btn-next" class="btn-nav" onclick="nextCard()" disabled>
            下一张
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
